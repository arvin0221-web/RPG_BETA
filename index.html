<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>製杖RPG</title>
  <meta name="description" content="《製杖RPG》是一款簡單卻有趣的文字RPG冒險遊戲，立即點擊連結，直接在瀏覽器展開冒險，無需下載！">
  <meta name="keywords" content="製杖RPG, 製杖, 網頁遊戲, RPG, 免費遊戲, 線上遊戲, 線上免費遊戲, 推薦遊戲, GitHub Games">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="magic-bg"></div>
<div id="global-tip" style="display:none;text-align:center;color:#ffcc00;margin:8px;"></div>
<!-- 新手教學按鈕 -->
<button id="btn-tutorial" style="
    position: fixed;
    right: 12px;
    top: 130px;
    padding: 8px 12px;
    font-size: 16px;
    background: linear-gradient(135deg,#4caf50,#8bc34a);
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    z-index: 9999;
">📖 新手教學</button>

<!-- 教學控制按鈕：放大縮小重設，初始隱藏 -->
<div id="tutorial-controls" style="
    position: fixed;
    right: 12px;
    top: 180px;    /* 可以調整高度 */
    display: none; /* ⭐ 初始隱藏 */
    gap: 6px;
    z-index: 10000;
">
  <button id="tutorial-zoom-in">＋</button>
  <button id="tutorial-zoom-out">－</button>
  <button id="tutorial-zoom-reset">重設</button>
</div>



<div class="wrap">
  <h1>製杖RPG</h1>

  <!-- 玩家資訊 -->
  <div class="card">
    <div id="player-name"></div>
    <img id="player-weapon-img" src="assets/weapons/wand_common.png" width="64">
    <pre id="player-stats"></pre>

    <div style="font-size:14px;color:#ccc;">
      擊敗怪物可恢復 20% HP 與 20% MP
    </div>

    <button id="btn-start">開始遇怪</button>
    <button id="btn-wand">杖</button>
    <button id="btn-shop">商店</button>
    <button id="btn-save">存檔</button>
    <button id="btn-boss-challenge">挑戰 BOSS 🐲</button>
<div id="boss-levels" style="display:none; margin-top:5px;"></div>
  </div>

  <!-- 戰鬥區 -->
  <div class="card" id="battle" style="display:none;">
    <h2 id="monster-name"></h2>
    <img id="monster-img" width="80">
    <div id="monster-hp"></div>

    <button id="btn-attack">普通攻擊</button>
    <button id="btn-fire">火球術</button>
    <button id="btn-heal">治癒術</button>
    <button id="btn-ultimate">蒼穹滅世斬</button>
    <button id="btn-mega-heal">神聖大恢復</button>


    <div id="battle-log" style="margin-top:6px;font-size:14px;"></div>
  </div>

  <!-- 杖背包 -->
  <div class="card" id="wand-panel" style="display:none; max-height:70vh; overflow-y:auto;">
    <h3>杖背包</h3>
    <div id="wand-list"></div>
    <button onclick="closePanels()">關閉</button>
   
  </div>

  <!-- 商店 -->
  <div class="card" id="shop-panel" style="display:none;">
    <h3>商店</h3>
    <div id="shop-list"></div>
    <button onclick="closePanels()">關閉</button>
  </div>

  <div class="card" id="tutorial-panel" style="
    display:none;
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    max-height: 70vh;
    background-color: #222;
    color: #fff;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    overflow-y: auto;
    overflow-x: auto;
    z-index: 1000;
">
    <h3 style="text-align:center;">新手教學</h3>
    <div id="tutorial-content" style="white-space: pre-wrap;"></div>
    <button id="btn-close-tutorial" style="
        margin-top: 12px;
        width: 100%;
        padding: 6px;
        font-size: 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    ">關閉</button>
</div>


</div>

<script src="app.js"></script>
<script src="extra.js"></script>
<script src="pet.js"></script>
<script src="Rank.js"></script>
<script src="vip.js"></script>
<script src="magic-background.js"></script>
<script src="global-tip-layer.js"></script>
<script src="tutorial.js"></script>
<script src="boss.js"></script>




</body>
</html>
